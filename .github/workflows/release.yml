name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Compile binary
        run: pnpm tauri build --no-bundle --verbose

      - name: Bundle installer
        run: pnpm tauri bundle --verbose

      - name: Show generated files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "src-tauri\target\release\bundle"

      - name: Create GitHub Release
        shell: pwsh
        run: |
          gh release create ${{ github.ref_name }} `
            --title "FluxNet ${{ github.ref_name }}" `
            --notes "Draft release generated by GitHub Actions." `
            --draft `
            --prerelease `
            src-tauri/target/release/bundle/nsis/FluxNet_*.exe
            env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
