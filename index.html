<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluxNet</title>
    <script>
      // Apply the saved light/dark choice before first paint so a dark-mode
      // user never sees a flash of the light background.
      (function () {
        try {
          var mode = localStorage.getItem("fluxnet_color_mode") || "system";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/branding/favicon.png" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Disable right-click context menu to make the app feel native
      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        return false;
      });
      // Disable text selection drag
      document.addEventListener("dragstart", function (e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
