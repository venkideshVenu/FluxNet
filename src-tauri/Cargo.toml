[package]
name = "fluxnet"
version = "0.1.2"
description = "Real-time network monitoring desktop application built with Tauri, Rust, and React"
authors = ["Venkidesh"]
license = "GPL-3.0-or-later"
repository = "https://github.com/venkideshVenu/FluxNet"
edition = "2024"

build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.31"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1.2"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
] }
winreg = "0.55"
# Must match the versions Tauri's webview (wry) uses so COM types line up.
webview2-com = "0.38"
windows-core = "0.61"

[dev-dependencies]
chrono-tz = "0.10"
